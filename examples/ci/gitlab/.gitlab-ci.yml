stages:
  - validate

aec-validation:
  image: node:22-bookworm-slim
  stage: validate
  variables:
    AEC_API_URL: $AEC_API_URL
    AEC_API_TOKEN: $AEC_API_TOKEN
    AEC_PROJECT_ID: $AEC_PROJECT_ID
  script:
    - |
      node bin/aec-validator.mjs validate \
        --model building.ifc \
        --spec project-requirements.xlsx \
        --baseline main \
        --fail-on critical \
        --json aec-report.json \
        --csv aec-report.csv \
        --sarif aec-report.sarif
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - aec-report.json
      - aec-report.csv
      - aec-report.sarif
