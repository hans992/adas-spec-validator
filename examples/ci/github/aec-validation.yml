name: AEC validation

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate IFC against project baseline
        id: aec
        continue-on-error: true
        env:
          AEC_API_URL: ${{ secrets.AEC_API_URL }}
          AEC_API_TOKEN: ${{ secrets.AEC_API_TOKEN }}
          AEC_PROJECT_ID: ${{ secrets.AEC_PROJECT_ID }}
        run: |
          node bin/aec-validator.mjs validate \
            --model building.ifc \
            --spec project-requirements.xlsx \
            --baseline main \
            --fail-on critical \
            --json aec-report.json \
            --csv aec-report.csv \
            --sarif aec-report.sarif
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aec-validation-reports
          path: aec-report.*
      - name: Publish SARIF
        if: always() && hashFiles('aec-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: aec-report.sarif
      - name: Enforce validation gate
        if: steps.aec.outcome == 'failure'
        run: exit 1
